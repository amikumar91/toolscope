[project]
name = "toolscope"
version = "0.1.0"
description = "Measure whether an LLM actually finds and uses your MCP tools: discovery -> selection -> invocation -> outcome funnel, across models and tool-exposure modes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amikumar91" }]
keywords = ["mcp", "llm", "evaluation", "tool-use", "agents", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.9",          # works with 1.x and 2.x
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]      # any provider: anthropic/, openai/, gemini/, bedrock/, ollama/ ...
tiktoken = ["tiktoken>=0.7"]     # exact token counts for schema cost (falls back to chars/4)
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/amikumar91/toolscope"
Repository = "https://github.com/amikumar91/toolscope"
Issues = "https://github.com/amikumar91/toolscope/issues"

[project.scripts]
toolscope = "toolscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep hand-aligned README snippets as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501", # line length is owned by `ruff format`; long strings/comments are left alone
  "B008", # typer.Option/Argument in defaults is the typer idiom
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["toolscope"]

[tool.coverage.report]
fail_under = 85
show_missing = true
