[project]
name = "toolscope"
version = "0.1.0"
description = "Measure whether an LLM actually finds and uses your MCP tools: discovery -> selection -> invocation -> outcome funnel, across models and tool-exposure modes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amikumar91" }]
keywords = ["mcp", "llm", "evaluation", "tool-use", "agents", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.9",          # works with 1.x and 2.x
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]      # any provider: anthropic/, openai/, gemini/, bedrock/, ollama/ ...
tiktoken = ["tiktoken>=0.7"]     # exact token counts for schema cost (falls back to chars/4)
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/amikumar91/toolscope"
Repository = "https://github.com/amikumar91/toolscope"
Issues = "https://github.com/amikumar91/toolscope/issues"

[project.scripts]
toolscope = "toolscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
